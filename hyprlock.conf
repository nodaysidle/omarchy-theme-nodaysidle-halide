# nodaysidle Halide — Hyprlock
$color        = rgba(11, 12, 13, 1.0)
$inner_color  = rgba(6, 7, 8, 0.85)
$outer_color  = rgba(198, 206, 209, 1.0)
$font_color   = rgba(230, 232, 230, 1.0)
$check_color  = rgba(169, 227, 75, 1.0)

background {
    monitor =
    path = screenshot
    blur_passes = 0
    color = rgba(5, 6, 7, 0.72)
}

input-field {
    monitor =
    size = 320, 44
    outline_thickness = 1
    rounding = 0
    dots_size = 0.18
    dots_spacing = 0.30
    dots_center = true
    outer_color = $outer_color
    inner_color = $inner_color
    font_color = $font_color
    fade_on_empty = false
    placeholder_text = <span foreground="##5F6668">PASSWORD</span>
    check_color = $check_color
    fail_color = rgba(224, 95, 95, 1.0)
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $font_color
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date "+%a %d %b %Y"
    color = rgba(95, 102, 104, 1.0)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}
